name: Atelier Motion V2 · integración de diseño
on:
  push:
    paths:
      - '.github/workflows/apply-atelier-motion-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integracion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama principal
        uses: actions/checkout@v4
      - name: Instalar assets de movimiento verificados
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/premium-css.gz.b64 <<'PREMIUM_CSS'
          
          PREMIUM_CSS
          cat > /tmp/premium-js.gz.b64 <<'PREMIUM_JS'
          
          PREMIUM_JS
          base64 -d /tmp/premium-css.gz.b64 | gzip -dc > premium.css
          base64 -d /tmp/premium-js.gz.b64 | gzip -dc > premium.js
          echo '7d481ae0789a414c5e69b470ddc8f5b141d631503bb4e44eb558f7b322187f71  premium.css' | sha256sum -c -
          echo 'd2050be8b3dd444411dba9d5bd8a979e07ace9d5dda66c5f962814efc95ecaf7  premium.js' | sha256sum -c -
      - name: Integrar hojas, scripts y titular editorial
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          edits = [
            ('<link rel="stylesheet" href="styles.css" />','<link rel="stylesheet" href="styles.css" />\n  <link rel="stylesheet" href="premium.css" />'),
            ('<script defer src="app.js"></script>','<script defer src="app.js"></script>\n  <script defer src="premium.js"></script>'),
            ('El arte está<br>en los <em>detalles.</em>','<span class="dt-title-line">El arte está</span><span class="dt-title-line">en los <em>detalles.</em></span>')
          ]
          for old,new in edits:
            if old not in s:
              raise RuntimeError('No se encontró el ancla HTML: '+old)
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'Accesorios para personas adultas' not in s
          assert s.count('src="premium.js"') == 1
          assert s.count('href="premium.css"') == 1
          PY
      - name: Validaciones estáticas
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check premium.js
          node --check catalog.js
          node --check config.js
          test -f assets/don-turron-emblema.jpg
          test -f assets/don-turron-monograma.png
      - name: Publicar cambios validados
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html premium.css premium.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: atelier motion V2 luxury interaction layer'
            git push origin HEAD:main
          fi
