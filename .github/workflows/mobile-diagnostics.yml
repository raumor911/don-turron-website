name: Diagnose mobile LCP
on:
  push:
    branches: [perf/mobile-production-core]
    paths: ['.github/workflows/mobile-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix /tmp/dt-audit --no-save lighthouse@13.5.0 puppeteer-core
      - name: Capture critical-path evidence
        run: |
          python -m http.server 8127 --bind 127.0.0.1 > /tmp/dt.log 2>&1 &
          node /tmp/dt-audit/node_modules/lighthouse/cli/index.js http://127.0.0.1:8127/ --chrome-flags='--headless --no-sandbox' --only-categories=performance --output=json --output-path=/tmp/report.json --quiet
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/report.json'));
          console.log('SCREEN '+JSON.stringify(r.configSettings.screenEmulation));
          for(const id of ['largest-contentful-paint','lcp-breakdown-insight','lcp-discovery-insight','render-blocking-insight','network-dependency-tree-insight','network-requests'])console.log('DIAGNOSTIC '+id+' '+JSON.stringify(r.audits[id]));
          JS
      - name: Inspect compositor and entrance timing
        run: |
          node - <<'JS'
          const fs=require('fs');
          const puppeteer=require('/tmp/dt-audit/node_modules/puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const [label,extra] of [['current',''],['no-blur','.age-overlay{backdrop-filter:none!important}'],['no-motion','.hero *,.hero *::after{animation:none!important;transition:none!important}'],['no-noise','.hero-noise{display:none!important}'],['no-filters','.hero-photo,.hero-art{filter:none!important;transition:none!important}']]){
              const page=await browser.newPage();await page.setViewport({width:412,height:823,deviceScaleFactor:1.75,isMobile:true,hasTouch:true});
              await page.evaluateOnNewDocument(()=>{window.lcps=[];new PerformanceObserver(l=>{for(const e of l.getEntries())window.lcps.push({time:e.startTime,url:e.url,element:e.element?.outerHTML.slice(0,250)})}).observe({type:'largest-contentful-paint',buffered:true});});
              await page.setRequestInterception(true);
              page.on('request',req=>req.url().endsWith('/site.css')?req.respond({status:200,contentType:'text/css',body:fs.readFileSync('site.css','utf8')+extra}):req.continue());
              await page.goto('http://127.0.0.1:8127/',{waitUntil:'networkidle0'});await new Promise(r=>setTimeout(r,5500));
              console.log('BROWSER '+label+' '+JSON.stringify(await page.evaluate(()=>({width:innerWidth,lcps:window.lcps,art:[...document.querySelectorAll('.hero-art,.hero-photo,.dt-title-line')].map(n=>({class:n.className,animation:getComputedStyle(n).animationName,transition:getComputedStyle(n).transition,filter:getComputedStyle(n).filter})),animations:document.getAnimations().map(a=>({name:a.animationName,target:a.effect?.target?.className}))}))));await page.close();
            }
            await browser.close();
          })();
          JS
      - name: Lighthouse compositor isolation
        run: |
          cp site.css /tmp/dt-original.css
          node --input-type=module - <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const base=fs.readFileSync('/tmp/dt-original.css','utf8');
          for(const [label,extra] of [['no-blur','.age-overlay{backdrop-filter:none!important}'],['no-motion','*,*::before,*::after{animation:none!important;transition:none!important}'],['no-noise','.hero-noise{display:none!important}'],['no-filters','.hero-photo,.hero-art{filter:none!important;transition:none!important}']]){
            fs.writeFileSync('site.css',base+extra);
            execFileSync(process.execPath,['/tmp/dt-audit/node_modules/lighthouse/cli/index.js','http://127.0.0.1:8127/','--chrome-flags=--headless --no-sandbox','--only-categories=performance','--output=json','--output-path=/tmp/variant.json','--quiet']);
            const r=JSON.parse(fs.readFileSync('/tmp/variant.json'));console.log('VARIANT '+label+' '+JSON.stringify({lcp:r.audits['largest-contentful-paint'].numericValue,fcp:r.audits['first-contentful-paint'].numericValue,cls:r.audits['cumulative-layout-shift'].numericValue,breakdown:r.audits['lcp-breakdown-insight'].details}));
          }
          fs.writeFileSync('site.css',base);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: lcp-diagnostic
          path: /tmp/report.json
