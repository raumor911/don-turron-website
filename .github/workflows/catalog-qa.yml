name: Don Turrón — catálogo y navegación
on:
  push:
    branches: [main]
    paths:
      - 'catalog.js'
      - 'app.js'
      - 'gallery.js'
      - 'gallery.css'
      - 'premium.css'
      - 'index.html'
      - 'tests/qa_browser.py'
      - 'assets/products/**'
      - '.github/workflows/catalog-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validación de JavaScript
        run: |
          node --check app.js
          node --check catalog.js
          node --check premium.js
          node --check config.js
      - name: Dependencias para pruebas de navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pruebas escritorio y móvil
        run: python tests/qa_browser.py
