name: Don Turrón — catálogo y navegación
on:
  push:
    branches: [main]
    paths:
      - 'catalog.js'
      - 'app.js'
      - 'premium.css'
      - 'index.html'
      - 'tests/qa_browser.py'
      - 'assets/products/**'
      - '.github/workflows/catalog-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validación de JavaScript
        run: |
          node --check app.js
          node --check catalog.js
          node --check premium.js
          node --check config.js
      - name: Dependencias para pruebas de navegador
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Pruebas escritorio y móvil
        run: |
          set -o pipefail
          python tests/qa_browser.py 2>&1 | tee /tmp/catalog-qa-last.log
      - name: Guardar diagnóstico temporal si falla
        if: failure()
        run: |
          cp /tmp/catalog-qa-last.log docs/.qa-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.qa-diagnostic.log
          git commit -m 'test: capture temporary browser diagnostic'
          git push origin HEAD:main
