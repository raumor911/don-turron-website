name: Importar fuentes Don Turrón V1

on:
  push:
    paths:
      - '.github/workflows/importar-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar y extraer paquete V1
        shell: bash
        run: |
          set -euo pipefail
          test -f Don-Turron-Sitio-Premium-v1.zip
          echo "4237f96e63072b846bc49501709a461659958a26  Don-Turron-Sitio-Premium-v1.zip" | git hash-object --stdin >/dev/null
          test "$(git hash-object Don-Turron-Sitio-Premium-v1.zip)" = "4237f96e63072b846bc49501709a461659958a26"
          mkdir -p .source-tmp
          unzip -q Don-Turron-Sitio-Premium-v1.zip -d .source-tmp
          test -f .source-tmp/don-turron/index.html
          test -f .source-tmp/don-turron/assets/don-turron-emblema.jpg
          test -f .source-tmp/don-turron/assets/don-turron-monograma.png
          cp -a .source-tmp/don-turron/. ./
          rm -rf .source-tmp
          node --check app.js
          node --check catalog.js
          node --check config.js
      - name: Registrar fuentes en main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md robots.txt index.html app.js catalog.js config.js styles.css make-art.py assets/ docs/ tests/qa_browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish Don Turrón premium storefront V1 sources'
            git push origin HEAD:main
          fi
