name: Don Turrón — Hostinger Node.js runtime
on:
  pull_request:
    paths:
      - 'server.js'
      - 'scripts/build-hostinger.cjs'
      - 'scripts/prepare-hostinger.cjs'
      - '.gitignore'
      - 'docs/HOSTINGER_NODE_DEPLOY.md'
      - 'api/**'
      - 'app.js'
      - 'tests/catalog-cache.test.mjs'
      - 'tests/catalog-publication.test.mjs'
      - 'tests/qa_hidden_publication.py'
      - 'package.json'
      - 'tests/hostinger-server.test.mjs'
      - 'telemetry/**'
      - '.github/workflows/hostinger-node.yml'
  push:
    branches: [main, fix/hostinger-node-express-start]
    paths:
      - 'server.js'
      - 'scripts/build-hostinger.cjs'
      - 'scripts/prepare-hostinger.cjs'
      - '.gitignore'
      - 'docs/HOSTINGER_NODE_DEPLOY.md'
      - 'api/**'
      - 'app.js'
      - 'tests/catalog-cache.test.mjs'
      - 'tests/catalog-publication.test.mjs'
      - 'tests/qa_hidden_publication.py'
      - 'package.json'
      - 'tests/hostinger-server.test.mjs'
      - 'telemetry/**'
      - '.github/workflows/hostinger-node.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Check postinstall artifacts and idempotent production build
        run: |
          test -f dist/server.cjs
          test -f dist/public/index.html
          test -f dist/public/sitemap.xml
          npm run build
          node --check dist/server.cjs
          node --check server.js
          node --check api/catalog.js
          node --check scripts/build-hostinger.cjs
          node --check scripts/prepare-hostinger.cjs
      - name: Exercise Express HTTP routes and private-file boundaries
        run: npm run test:hostinger
      - name: Verify independent publication status and catalog pricing
        run: node --test tests/catalog-publication.test.mjs
      - name: Verify efficient MySQL reads and cache expiry
        run: node --test tests/catalog-cache.test.mjs
      - name: Verify inventory contract remains independent
        run: npm run test:inventory
